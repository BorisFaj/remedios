name: Build and Push Core Services

on:
  push:
    branches: ["develop"]
    paths:
      - "remedios/core/api/**"
      - "remedios/core/dispatcher/**"
      - ".github/workflows/build-and-push.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "remedios/core/api/**"
      - "remedios/core/dispatcher/**"
      - ".github/workflows/build-and-push.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  DO_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dispatcher
            image: remedios-dispatcher
            dockerfile: ./remedios/core/dispatcher/Dockerfile
            context: .
          - name: remedios-api
            image: remedios-api
            dockerfile: ./remedios/core/api/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: vars
        run: echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ env.OWNER }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=raw,value=develop
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DO_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
