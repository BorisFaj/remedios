name: Docker Healthchecks

on:
  pull_request:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - ".github/workflows/docker-healthchecks.yml"
  push:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - ".github/workflows/docker-healthchecks.yml"

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: whisper-cpp
            context: .
            dockerfile: remedios/consumers/audio/whispercpp/Dockerfile
            port: 8001
            health: /health
            env: |
              HEALTHCHECK_ONLY=1
              APP_PORT=8001
          - name: whisper-turbo
            context: .
            dockerfile: remedios/consumers/audio/whisper_turbo/Dockerfile
            port: 8080
            health: /health
            env: |
              HEALTHCHECK_ONLY=1
          - name: remetext
            context: .
            dockerfile: remedios/consumers/text/Dockerfile
            port: 8080
            health: /health
            env: |
              HEALTHCHECK_ONLY=1
          - name: remedios-api
            context: .
            dockerfile: remedios/core/api/Dockerfile
            port: 3000
            health: /health
            env: |
              INTERNAL_API_TOKEN=dummy
              GRAPH_API_TOKEN=dummy
              GRAPH_URL=https://example.com
          - name: dispatcher
            context: .
            dockerfile: remedios/core/dispatcher/Dockerfile
            port: 3000
            health: /health
            env: |
              HEALTHCHECK_ONLY=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }}
        run: |
          docker build -t test-${{ matrix.name }} \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Run ${{ matrix.name }}
        run: |
          docker run -d --name ${{ matrix.name }} \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            --env-file <(printf '%s\n' "${{ matrix.env }}") \
            test-${{ matrix.name }}

      - name: Wait for health ${{ matrix.name }}
        run: |
          for i in {1..30}; do
            if docker ps --format '{{.Names}}' | grep -q "^${{ matrix.name }}$"; then
              if curl -fsS "http://localhost:${{ matrix.port }}${{ matrix.health }}" > /dev/null; then
                exit 0
              fi
              sleep 5
            else
              echo "Container ${{ matrix.name }} is not running" >&2
              docker ps -a
              docker logs ${{ matrix.name }} || true
              exit 1
            fi
          done
          echo "Healthcheck failed for ${{ matrix.name }}" >&2
          docker logs ${{ matrix.name }}
          exit 1

      - name: Logs ${{ matrix.name }}
        if: always()
        run: docker logs ${{ matrix.name }} || true

      - name: Stop ${{ matrix.name }}
        if: always()
        run: docker rm -f ${{ matrix.name }} || true

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r remedios/test/requirements_dev.txt
          pip install -r remedios/core/api/requirements.txt
          pip install -r remedios/consumers/text/requirements.txt
          pip install -r remedios/consumers/audio/whisper_turbo/requirements.txt

      - name: Run unit tests
        run: pytest -q remedios/test/test_persistence_storage.py remedios/test/test_consumers_processing.py
