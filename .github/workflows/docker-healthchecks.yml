name: Docker Healthchecks

on:
  pull_request:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - ".github/workflows/docker-healthchecks.yml"
  push:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - ".github/workflows/docker-healthchecks.yml"

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: remeaudio
            context: remedios
            dockerfile: remedios/apis/Dockerfile_audio
            port: 8001
            health: /health
            env: >
              GRAPH_API_TOKEN=dummy
              GRAPH_URL=https://example.com
              WHISPER_MODEL=ggml-tiny.en.bin
              WHISPER_MODEL_REPO=ggerganov/whisper.cpp
          - name: remetext
            context: remedios
            dockerfile: remedios/apis/Dockerfile_text
            port: 8000
            health: /health
            env: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }}
        run: |
          docker build -t test-${{ matrix.name }} \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Run ${{ matrix.name }}
        run: |
          env_args=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            env_args="$env_args -e $line"
          done <<< "${{ matrix.env }}"
          docker run -d --rm --name ${{ matrix.name }} \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            $env_args \
            test-${{ matrix.name }}

      - name: Wait for health ${{ matrix.name }}
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:${{ matrix.port }}${{ matrix.health }}" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck failed for ${{ matrix.name }}" >&2
          docker logs ${{ matrix.name }}
          exit 1

      - name: Logs ${{ matrix.name }}
        if: always()
        run: docker logs ${{ matrix.name }} || true

      - name: Stop ${{ matrix.name }}
        if: always()
        run: docker stop ${{ matrix.name }} || true
