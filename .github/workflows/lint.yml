name: Lint (ruff)

on:
  push:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - "remedios/test/requirements_dev.txt"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - "remedios/test/requirements_dev.txt"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev requirements
        run: python -m pip install -r remedios/test/requirements_dev.txt

      - name: Ruff (unused imports)
        run: python -m ruff check --select F401 .
