name: Build and Push Remeaudio (develop)

on:
  push:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - "zordon/deploy/audio_whispercpp.yaml"
      - ".github/workflows/build-and-push-remeaudio.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - "zordon/deploy/audio_whispercpp.yaml"
      - ".github/workflows/build-and-push-remeaudio.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: remeaudio-whispercpp
  DOCKERFILE: ./remedios/apis/audio/whispercpp/Dockerfile
  CONTEXT: ./
  DO_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
  ARCH_TAG_AMD64: amd64-latest
  ARCH_TAG_ARM64: arm64-latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        id: vars
        run: echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ env.OWNER }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DO_PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ env.ARCH_TAG_AMD64 }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ env.ARCH_TAG_ARM64 }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          no-cache: true
