name: Sync Private Repo with Public

on:
  repository_dispatch:
    types: [sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Add Public Repo as Upstream and Fetch Changes
        run: |
          git remote add upstream https://github.com/BorisFaj/remedios-public.git || true
          git fetch upstream

      - name: Merge Upstream Changes into Main
        run: |
          git checkout main
          git merge --no-edit upstream/main || echo "No hay cambios para fusionar"
          git push origin main
