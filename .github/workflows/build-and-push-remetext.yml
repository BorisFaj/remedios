name: Build and Push Remetext (develop)

on:
  push:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - "zordon/deploy/remetext.yaml"
      - ".github/workflows/build-and-push-remetext.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "remedios/**"
      - "zordon/deploy/remetext.yaml"
      - ".github/workflows/build-and-push-remetext.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: remetext
  DOCKERFILE: ./remedios/apis/text/Dockerfile_text
  CONTEXT: ./
  DO_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DO_PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/$(echo "${{ env.OWNER }}" | tr '[:upper:]' '[:lower:]')/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/$(echo "${{ env.OWNER }}" | tr '[:upper:]' '[:lower:]')/${{ env.IMAGE_NAME }}:develop
            ${{ env.REGISTRY }}/$(echo "${{ env.OWNER }}" | tr '[:upper:]' '[:lower:]')/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
