apiVersion: v1
kind: ConfigMap
metadata:
  name: remeaudio-turbo-config
  namespace: remedios
data:
  KAFKA_TOPIC: "whatsapp-audio"
  KAFKA_GROUP_ID: "remeaudio-turbo"
  WHISPER_MODEL: "BorisFaj/whisperL-v3-turbo"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remeaudio-turbo
  namespace: remedios
  labels:
    app: remeaudio-turbo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remeaudio-turbo
  template:
    metadata:
      labels:
        app: remeaudio-turbo
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: remeaudio-turbo
        image: ghcr.io/borisfaj/remeaudio-whisperturbo:arm64-latest
        imagePullPolicy: Always
        env:
        - name: APP_PORT
          value: "8001"
        - name: WHISPER_BACKEND
          value: "turbo"
        envFrom:
        - configMapRef:
            name: remedios-config
        - configMapRef:
            name: remeaudio-turbo-config
        - secretRef:
            name: remedios-secrets
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
      nodeSelector:
        kubernetes.io/arch: arm64
---
apiVersion: v1
kind: Service
metadata:
  name: remeaudio
  namespace: remedios
spec:
  selector:
    app: remeaudio-turbo
  ports:
  - port: 8001
    targetPort: 8001
