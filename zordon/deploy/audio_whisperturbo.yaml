apiVersion: v1
kind: ConfigMap
metadata:
  name: whisper-turbo-config
  namespace: remedios
data:
  WHISPER_MODEL: "BorisFaj/whisperL-v3-turbo"
  INTERNAL_API_URL: "http://remedios-api:3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-turbo
  namespace: remedios
  labels:
    app: whisper-turbo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whisper-turbo
  template:
    metadata:
      labels:
        app: whisper-turbo
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: whisper-turbo
        image: ghcr.io/borisfaj/whisper-turbo:arm64-latest
        imagePullPolicy: Always
        env:
        - name: APP_PORT
          value: "8001"
        - name: WHISPER_BACKEND
          value: "turbo"
        - name: UPLOAD_AUDIO_ENABLED
          value: "1"
        - name: UPLOAD_AUDIO_WORKERS
          value: "2"
        - name: UPLOAD_AUDIO_TIMEOUT
          value: "30"
        envFrom:
        - configMapRef:
            name: remedios-config
        - configMapRef:
            name: whisper-turbo-config
        - secretRef:
            name: remedios-secrets
        ports:
        - containerPort: 8001
        volumeMounts:
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "1"
            memory: "6Gi"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - whisper-turbo
            topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "kubernetes.io/hostname"
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: whisper-turbo
      nodeSelector:
        kubernetes.io/arch: arm64
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-turbo
  namespace: remedios
spec:
  selector:
    app: whisper-turbo
  ports:
  - port: 8001
    targetPort: 8001
