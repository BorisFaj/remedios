apiVersion: v1
kind: Secret
metadata:
  name: remedios-secret
  namespace: remedios
type: Opaque
stringData:
  WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remedios-config
  namespace: remedios
data:
  BOOTSTRAP_SERVER: "kafka.kafka.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remedios
  namespace: remedios
  labels:
    app: remedios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remedios
  template:
    metadata:
      labels:
        app: remedios
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: remedios
          image: ghcr.io/borisfaj/remedios:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: remedios-config
            - secretRef:
                name: remedios-secret
            - secretRef:
                name: remedios-secrets
          env:
            - name: ORACLE_WALLET_PATH
              value: /opt/oracle/wallet
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: oracle-wallet
              mountPath: /opt/oracle/wallet
              readOnly: true
      volumes:
        - name: oracle-wallet
          secret:
            secretName: oracle-wallet
---
apiVersion: v1
kind: Service
metadata:
  name: remedios
  namespace: remedios
spec:
  type: ClusterIP
  selector:
    app: remedios
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remedios
  namespace: remedios
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remedios
                port:
                  number: 80
