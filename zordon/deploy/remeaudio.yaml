apiVersion: v1
kind: ConfigMap
metadata:
  name: remeaudio-config
  namespace: remedios
data:
  KAFKA_TOPIC: "whatsapp-audio"
  KAFKA_GROUP_ID: "remeaudio"
  WHISPER_MODEL: "ggml-large-v3-turbo-q5_0.bin"
  WHISPER_MODEL_REPO: "ggerganov/whisper.cpp"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remeaudio
  namespace: remedios
  labels:
    app: remeaudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remeaudio
  template:
    metadata:
      labels:
        app: remeaudio
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: remeaudio
        image: ghcr.io/borisfaj/remeaudio:arm64-latest
        imagePullPolicy: Always
        command: ["/app/remedios/.venv/bin/python", "-m", "remedios.apis.audio_service"]
        envFrom:
        - configMapRef:
            name: remedios-config
        - configMapRef:
            name: remeaudio-config
        - secretRef:
            name: remedios-secrets
        env:
        - name: WHISPER_MODEL
          valueFrom:
            configMapKeyRef:
              name: remeaudio-config
              key: WHISPER_MODEL
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: "500m"
            memory: "3Gi"
          limits:
            cpu: "2000m"
            memory: "5Gi"
      nodeSelector:
        kubernetes.io/arch: arm64
---
apiVersion: v1
kind: Service
metadata:
  name: remeaudio
  namespace: remedios
spec:
  selector:
    app: remeaudio
  ports:
  - port: 8001
    targetPort: 8001
