apiVersion: v1
kind: Secret
metadata:
  name: remedios-secret
  namespace: remedios
type: Opaque
stringData:
  WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remedios-config
  namespace: remedios
data:
  BOOTSTRAP_SERVER: "kafka.kafka.svc.cluster.local:9092"
  INTERNAL_API_URL: "http://remedios-api"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: remedios
  labels:
    app: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: dispatcher
          image: ghcr.io/borisfaj/remedios-dispatcher:latest
          imagePullPolicy: Always
          command: ["/app/remedios/.venv/bin/python", "-m", "remedios.core.dispatcher.producer"]
          envFrom:
            - configMapRef:
                name: remedios-config
            - secretRef:
                name: remedios-secret
            - secretRef:
                name: remedios-secrets
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remedios-secrets
                  key: INTERNAL_API_TOKEN
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: remedios
spec:
  type: ClusterIP
  selector:
    app: dispatcher
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remedios
  namespace: remedios
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: dispatcher
                port:
                  number: 80
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: dispatcher
                port:
                  number: 80
