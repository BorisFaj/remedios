apiVersion: v1
kind: ConfigMap
metadata:
  name: remeaudio-config
  namespace: remedios
data:
  KAFKA_TOPIC: "whatsapp-audio"
  KAFKA_GROUP_ID: "remeaudio"
  WHISPER_MODEL: "/app/ggml-large-v3-turbo-q5_0.bin"
  WHISPER_MODEL_REPO: "ggerganov/whisper.cpp"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remeaudio
  namespace: remedios
  labels:
    app: remeaudio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remeaudio
  template:
    metadata:
      labels:
        app: remeaudio
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: remeaudio
        image: ghcr.io/borisfaj/remeaudio-whispercpp:arm64-latest
        imagePullPolicy: Always
        env:
        - name: APP_PORT
          value: "8001"
        - name: WHISPER_SERVER_THREADS
          value: "1"
        envFrom:
        - configMapRef:
            name: remedios-config
        - configMapRef:
            name: remeaudio-config
        - secretRef:
            name: remedios-secrets
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
      nodeSelector:
        kubernetes.io/arch: arm64
---
apiVersion: v1
kind: Service
metadata:
  name: remeaudio-cpp
  namespace: remedios
spec:
  selector:
    app: remeaudio
  ports:
  - port: 8001
    targetPort: 8001
