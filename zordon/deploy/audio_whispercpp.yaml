apiVersion: v1
kind: ConfigMap
metadata:
  name: whisper-cpp-config
  namespace: remedios
data:
  WHISPER_MODEL: "/app/ggml-large-v3-turbo-q5_0.bin"
  WHISPER_MODEL_REPO: "ggerganov/whisper.cpp"
  INTERNAL_API_URL: "http://remedios"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-cpp
  namespace: remedios
  labels:
    app: whisper-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-cpp
  template:
    metadata:
      labels:
        app: whisper-cpp
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: whisper-cpp
        image: ghcr.io/borisfaj/whisper-cpp:arm64-latest
        imagePullPolicy: Always
        env:
        - name: APP_PORT
          value: "8001"
        - name: WHISPER_SERVER_THREADS
          value: "1"
        - name: WHISPER_BACKEND
          value: "cpp"
        envFrom:
        - configMapRef:
            name: remedios-config
        - configMapRef:
            name: whisper-cpp-config
        - secretRef:
            name: remedios-secrets
        ports:
        - containerPort: 8001
        - containerPort: 9000
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "1"
            memory: "4Gi"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - whisper-turbo
            topologyKey: "kubernetes.io/hostname"
      nodeSelector:
        kubernetes.io/arch: arm64
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-cpp
  namespace: remedios
spec:
  selector:
    app: whisper-cpp
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  - name: whisper
    port: 9000
    targetPort: 9000
