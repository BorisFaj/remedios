apiVersion: apps/v1
kind: Deployment
metadata:
  name: remedios-api
  namespace: remedios
  labels:
    app: remedios-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remedios-api
  template:
    metadata:
      labels:
        app: remedios-api
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: remedios-api
          image: ghcr.io/borisfaj/remedios-api:latest
          imagePullPolicy: Always
          command: ["/app/remedios/.venv/bin/python", "-m", "remedios.core.api.server"]
          envFrom:
            - secretRef:
                name: remedios-secrets
          env:
            - name: ORACLE_WALLET_PATH
              value: /opt/oracle/wallet
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remedios-secrets
                  key: INTERNAL_API_TOKEN
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: oracle-wallet
              mountPath: /opt/oracle/wallet
              readOnly: true
      volumes:
        - name: oracle-wallet
          secret:
            secretName: oracle-wallet
---
apiVersion: v1
kind: Service
metadata:
  name: remedios-api
  namespace: remedios
spec:
  selector:
    app: remedios-api
  ports:
    - port: 3000
      targetPort: 3000
