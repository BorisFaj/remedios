apiVersion: v1
kind: ConfigMap
metadata:
  name: remetext-config
  namespace: remedios
data:
  KAFKA_TOPIC: "whatsapp-text"
  KAFKA_GROUP_ID: "remetext"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remetext
  namespace: remedios
  labels:
    app: remetext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remetext
  template:
    metadata:
      labels:
        app: remetext
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: remetext
        image: ghcr.io/borisfaj/remetext:latest
        imagePullPolicy: Always
        command: ["/app/remedios/.venv/bin/python", "-m", "remedios.consumers.text.consumer"]
        envFrom:
        - configMapRef:
            name: remedios-config
        - configMapRef:
            name: remetext-config
        - secretRef:
            name: remedios-secrets
        env:
        - name: ORACLE_WALLET_PATH
          value: /opt/oracle/wallet
        - name: INTERNAL_API_URL
          value: http://remedios-api
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: oracle-wallet
          mountPath: /opt/oracle/wallet
          readOnly: true
      volumes:
      - name: oracle-wallet
        secret:
          secretName: oracle-wallet
---
apiVersion: v1
kind: Service
metadata:
  name: remetext
  namespace: remedios
spec:
  selector:
    app: remetext
  ports:
  - port: 8080
    targetPort: 8080
