apiVersion: apps/v1
kind: Deployment
metadata:
  name: remedios
  namespace: remedios
labels:
    app: remedios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remedios
  template:
    metadata:
      labels:
        app: remedios
    spec:
      containers:
      - name: remedios
        image: tuuser/remedios:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: remedios
  namespace: remedios
spec:
  type: LoadBalancer   # Así lo expones afuera
  ports:
    - port: 80
      targetPort: 5000
  selector:
    app: remedios
