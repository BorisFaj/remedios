apiVersion: v1
kind: Namespace
metadata:
  name: remedios
---
apiVersion: v1
kind: Secret
metadata:
  name: remedios-secret
  namespace: remedios
type: Opaque
stringData:
  WEBHOOK_VERIFY_TOKEN: "845dr489fdgj46fgj4615"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remedios-config
  namespace: remedios
data:
  BOOTSTRAP_SERVER: "kafka.kafka.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remedios
  namespace: remedios
  labels:
    app: remedios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remedios
  template:
    metadata:
      labels:
        app: remedios
    spec:
      containers:
      - name: remedios
        image: ghcr.io/borisfaj/remedios:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: remedios-config
        - secretRef:
            name: remedios-secret
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: remedios
  namespace: remedios
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: remedios
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remedios
  namespace: remedios
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: remedios
            port:
              number: 80
  tls:
  - secretName: remedios-tls
