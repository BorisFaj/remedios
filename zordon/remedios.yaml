apiVersion: v1
kind: Namespace
metadata:
  name: remedios
---
apiVersion: v1
kind: Secret
metadata:
  name: remedios-secret
  namespace: remedios
type: Opaque
stringData:
  WEBHOOK_VERIFY_TOKEN: "845dr489fdgj46fgj4615"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remedios-config
  namespace: remedios
data:
  BOOTSTRAP_SERVER: "kafka.kafka.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remedios
  namespace: remedios
  labels:
    app: remedios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remedios
  template:
    metadata:
      labels:
        app: remedios
    spec:
      containers:
      - name: remedios
        image: tuuser/remedios:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: remedios-config
        - secretRef:
            name: remedios-secret
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: remedios
  namespace: remedios
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: remedios
