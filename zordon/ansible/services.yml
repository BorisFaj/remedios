---
- name: Build and deploy remedios services
  hosts: master
  become: true
  gather_facts: false
  vars:
    app_root: /opt/remedios
    src_dir: "{{ app_root }}/src"
    remedios_src: "{{ src_dir }}/remedios"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    secrets_src: "{{ playbook_dir }}/../.secrets"
    wallet_dir: "{{ app_root }}/wallet"
    oracle_dsn: "{{ lookup('ini', 'ORACLE_DSN type=properties file=' ~ secrets_src) | default('', true) | trim }}"
    whisper_model: "{{ lookup('env','WHISPER_MODEL') }}"
    whisper_model_repo: "{{ lookup('env','WHISPER_MODEL_REPO') }}"
    whisper_backend: "{{ lookup('env','WHISPER_BACKEND') }}"
    remedios_manifest: "{{ app_root }}/deploy/remedios.yaml"
    whisper_cpp_manifest: "{{ app_root }}/deploy/audio_whispercpp.yaml"
    whisper_turbo_manifest: "{{ app_root }}/deploy/audio_whisperturbo.yaml"
  tasks:
    - name: Verificar que existe el fichero .secrets en el controlador
      stat:
        path: "{{ secrets_src }}"
      register: secrets_file
      delegate_to: localhost
      run_once: true
      become: false

    - name: Abort if .secrets is missing
      fail:
        msg: "Crea {{ secrets_src }} con GRAPH_API_TOKEN, GRAPH_URL y el resto de variables necesarias"
      when: not secrets_file.stat.exists
      delegate_to: localhost
      run_once: true
      become: false

    - name: Leer ruta de wallet desde .secrets (ORACLE_WALLET_PATH)
      set_fact:
        wallet_src: "{{ lookup('ini', 'ORACLE_WALLET_PATH type=properties file=' ~ secrets_src) | default('', true) }}"

    - name: Validar que el wallet existe en el controlador (si se definió)
      stat:
        path: "{{ wallet_src }}"
      register: wallet_file
      delegate_to: localhost
      run_once: true
      become: false
      when: wallet_src | length > 0

    - name: Abortar si la ruta de wallet no existe en el controlador
      fail:
        msg: "ORACLE_WALLET_PATH='{{ wallet_src }}' no existe en el controlador. Ajusta la ruta en .secrets a un ZIP válido."
      when:
        - wallet_src | length > 0
        - wallet_file.stat is defined
        - not wallet_file.stat.exists

    - name: Abortar si el wallet no es una carpeta (descomprime localmente el zip)
      fail:
        msg: "ORACLE_WALLET_PATH debe apuntar a una carpeta (contenido descomprimido del wallet). Ajusta .secrets."
      when:
        - wallet_src | length > 0
        - wallet_file.stat is defined
        - wallet_file.stat.exists
        - not wallet_file.stat.isdir

    - name: Crear carpetas de trabajo
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ app_root }}"
        - "{{ src_dir }}"
        - "{{ app_root }}/deploy"
        - "{{ wallet_dir }}"

    - name: Sincronizar código de remedios al master
      synchronize:
        src: "{{ playbook_dir }}/../../remedios/"
        dest: "{{ remedios_src }}/"
        delete: no
        rsync_opts:
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=.git"

    - name: Copiar manifiesto de remedios (dispatcher)
      copy:
        src: ../deploy/remedios.yaml
        dest: "{{ remedios_manifest }}"
        mode: "0644"
      when: (deploy_remedios | default(false) | bool) == true

    - name: Copiar network policy de remedios (dispatcher)
      copy:
        src: ../deploy/remedios-networkpolicy.yaml
        dest: "{{ app_root }}/deploy/remedios-networkpolicy.yaml"
        mode: "0644"
      when: (deploy_remedios | default(false) | bool) == true

    - name: Copiar manifiesto de remetext
      copy:
        src: ../deploy/remetext.yaml
        dest: "{{ app_root }}/deploy/remetext.yaml"
        mode: "0644"
      when: (deploy_remetext | default(false) | bool) == true

    - name: Copiar manifiesto de whisper-cpp
      copy:
        src: ../deploy/audio_whispercpp.yaml
        dest: "{{ whisper_cpp_manifest }}"
        mode: "0644"
      when: (deploy_whisper_cpp | default(false) | bool) == true

    - name: Copiar manifiesto de whisper-turbo
      copy:
        src: ../deploy/audio_whisperturbo.yaml
        dest: "{{ whisper_turbo_manifest }}"
        mode: "0644"
      when: (deploy_whisper_turbo | default(false) | bool) == true

    - name: Aplicar manifiesto de whisper-turbo
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f {{ whisper_turbo_manifest }}
      when: (deploy_whisper_turbo | default(false) | bool) == true

    - name: Reiniciar deployment whisper-turbo para coger cambios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout restart deployment/whisper-turbo -n remedios
      register: restart_audio_turbo
      changed_when: "'restarted' in restart_audio_turbo.stdout or restart_audio_turbo.rc == 0"
      when: (deploy_whisper_turbo | default(false) | bool) == true

    - name: Esperar rollout de whisper-turbo
      command: kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/whisper-turbo -n remedios
      when: (deploy_whisper_turbo | default(false) | bool) == true

    - name: Copiar .secrets al master
      copy:
        src: "{{ secrets_src }}"
        dest: "{{ app_root }}/.secrets"
        mode: "0600"

    - name: Sincronizar wallet de Oracle (carpeta ya descomprimida en el controlador)
      synchronize:
        src: "{{ wallet_src }}/"
        dest: "{{ wallet_dir }}/"
        delete: yes
      when:
        - wallet_src | length > 0
        - wallet_file.stat.exists
        - wallet_file.stat.isdir

    - name: Crear/actualizar secret oracle-wallet desde carpeta descomprimida
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} create secret generic oracle-wallet \
          --from-file={{ wallet_dir }}/ \
          -n remedios \
          --dry-run=client -o yaml | kubectl --kubeconfig={{ kubeconfig }} apply -f -
      when:
        - wallet_src | length > 0
        - wallet_file.stat.exists
        - wallet_file.stat.isdir

    - name: Validar credenciales de GHCR en .secrets
      shell: |
        set -a
        . {{ app_root }}/.secrets
        set +a
        # GHCR creds opcionales: si faltan, se intentará pull público
        if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
          echo "Aviso: GHCR_USERNAME/GHCR_TOKEN no definidos; se asume imagen pública" >&2
        fi
      args:
        chdir: "{{ remedios_src }}"
        executable: /bin/bash

    - name: Crear namespace remedios si no existe
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} get ns remedios >/dev/null 2>&1 || \
        kubectl --kubeconfig={{ kubeconfig }} create ns remedios
      changed_when: false

    - name: Crear/actualizar secret remedios-secrets desde .secrets (sin ORACLE_WALLET_PATH)
      shell: |
        tmp=$(mktemp)
        grep -Ev '^(ORACLE_WALLET_PATH|ORACLE_DSN)=' {{ app_root }}/.secrets > "$tmp"
        dsn="{{ oracle_dsn }}"
        if [ -z "$dsn" ] && [ -f "{{ wallet_dir }}/tnsnames.ora" ]; then
          dsn=$(awk 'match($0,/^[[:space:]]*([A-Za-z0-9._-]+)[[:space:]]*=/,a){print a[1]; exit}' {{ wallet_dir }}/tnsnames.ora)
        fi
        if [ -z "$dsn" ]; then
          echo "No se pudo determinar ORACLE_DSN (define ORACLE_DSN en .secrets o revisa tnsnames.ora)" >&2
          exit 1
        fi
        echo "ORACLE_DSN=$dsn" >> "$tmp"
        kubectl --kubeconfig={{ kubeconfig }} create secret generic remedios-secrets \
          --from-env-file="$tmp" \
          -n remedios \
          --dry-run=client -o yaml | kubectl --kubeconfig={{ kubeconfig }} apply -f -
        rm -f "$tmp"

    - name: Crear/actualizar pull secret ghcr-creds para GHCR (si hay credenciales)
      shell: |
        set -a
        . {{ app_root }}/.secrets
        set +a
        if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
          exit 0
        fi
        kubectl --kubeconfig={{ kubeconfig }} create secret docker-registry ghcr-creds \
          --docker-server=ghcr.io \
          --docker-username="$GHCR_USERNAME" \
          --docker-password="$GHCR_TOKEN" \
          -n remedios \
          --dry-run=client -o yaml | kubectl --kubeconfig={{ kubeconfig }} apply -f -

    - name: Renderizar manifiesto de remedios con variables de .secrets
      shell: |
        set -a
        . {{ app_root }}/.secrets
        set +a
        if [ -z "${DOMAIN:-}" ] || [ -z "${WEBHOOK_VERIFY_TOKEN:-}" ]; then
          echo "DOMAIN y WEBHOOK_VERIFY_TOKEN deben estar definidos en {{ app_root }}/.secrets" >&2
          exit 1
        fi
        envsubst < {{ remedios_manifest }} > /tmp/remedios.rendered.yaml
      args:
        executable: /bin/bash
      when: (deploy_remedios | default(false) | bool) == true

    - name: Aplicar manifiesto de remedios
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f /tmp/remedios.rendered.yaml
      when: (deploy_remedios | default(false) | bool) == true

    - name: Aplicar network policy de remedios
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f {{ app_root }}/deploy/remedios-networkpolicy.yaml
      when: (deploy_remedios | default(false) | bool) == true

    - name: Reiniciar deployment remedios para coger cambios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout restart deployment/remedios -n remedios
      register: restart_remedios
      changed_when: "'restarted' in restart_remedios.stdout or restart_remedios.rc == 0"
      when: (deploy_remedios | default(false) | bool) == true

    - name: Esperar rollout de remedios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/remedios -n remedios
      when: (deploy_remedios | default(false) | bool) == true

    - name: Aplicar manifiesto de remetext
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f {{ app_root }}/deploy/remetext.yaml
      when: (deploy_remetext | default(true) | bool) == true

    - name: Reiniciar deployment remetext para coger cambios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout restart deployment/remetext -n remedios
      register: restart_out
      changed_when: "'restarted' in restart_out.stdout or restart_out.rc == 0"
      when: (deploy_remetext | default(true) | bool) == true

    - name: Esperar rollout de remetext
      command: kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/remetext -n remedios
      when: (deploy_remetext | default(true) | bool) == true

    - name: Aplicar manifiesto de whisper-cpp
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f {{ whisper_cpp_manifest }}
      when: (deploy_whisper_cpp | default(false) | bool) == true

    - name: Reiniciar deployment whisper-cpp para coger cambios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout restart deployment/whisper-cpp -n remedios
      register: restart_audio
      changed_when: "'restarted' in restart_audio.stdout or restart_audio.rc == 0"
      when: (deploy_whisper_cpp | default(false) | bool) == true

    - name: Esperar rollout de whisper-cpp
      command: kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/whisper-cpp -n remedios
      when: (deploy_whisper_cpp | default(false) | bool) == true
