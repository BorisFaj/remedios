---
- name: Build and deploy remedios services
  hosts: master
  become: true
  gather_facts: false
  vars:
    app_root: /opt/remedios
    src_dir: "{{ app_root }}/src"
    remedios_src: "{{ src_dir }}/remedios"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    secrets_src: "{{ playbook_dir }}/../.secrets"
    wallet_dir: "{{ app_root }}/wallet"
    oracle_dsn: "{{ lookup('ini', 'ORACLE_DSN type=properties file=' ~ secrets_src) | default('', true) | trim }}"
    whisper_model: "{{ lookup('env','WHISPER_MODEL') }}"
    whisper_model_repo: "{{ lookup('env','WHISPER_MODEL_REPO') }}"
    whisper_backend: "{{ lookup('env','WHISPER_BACKEND') }}"
    dispatcher_manifest: "{{ app_root }}/deploy/dispatcher.yaml"
    api_manifest: "{{ app_root }}/deploy/remedios-api.yaml"
    dispatcher_image: "ghcr.io/borisfaj/remedios-dispatcher:latest"
    api_image: "ghcr.io/borisfaj/remedios-api:latest"
    whisper_turbo_manifest: "{{ app_root }}/deploy/audio_whisperturbo.yaml"
    openclaw_manifest: "{{ app_root }}/deploy/openclaw.yaml"
    openclaw_backup_manifest: "{{ app_root }}/deploy/openclaw-backup-cronjob.yaml"
    openclaw_ui_manifest: "{{ app_root }}/deploy/openclaw-ui-ingress.yaml"
  tasks:
    - name: Verificar que existe el fichero .secrets en el controlador
      stat:
        path: "{{ secrets_src }}"
      register: secrets_file
      delegate_to: localhost
      run_once: true
      become: false

    - name: Abort if .secrets is missing
      fail:
        msg: "Crea {{ secrets_src }} con GRAPH_API_TOKEN, GRAPH_URL y el resto de variables necesarias"
      when: not secrets_file.stat.exists
      delegate_to: localhost
      run_once: true
      become: false

    - name: Leer ruta de wallet desde .secrets (ORACLE_WALLET_PATH)
      set_fact:
        wallet_src: "{{ lookup('ini', 'ORACLE_WALLET_PATH type=properties file=' ~ secrets_src) | default('', true) }}"

    - name: Leer rutas OCI desde .secrets (OCI_CONFIG_PATH, OCI_API_KEY_PATH)
      set_fact:
        oci_config_src: "{{ lookup('ini', 'OCI_CONFIG_PATH type=properties file=' ~ secrets_src) | default('', true) }}"
        oci_key_src: "{{ lookup('ini', 'OCI_API_KEY_PATH type=properties file=' ~ secrets_src) | default('', true) }}"

    - name: Validar que el wallet existe en el controlador (si se definió)
      stat:
        path: "{{ wallet_src }}"
      register: wallet_file
      delegate_to: localhost
      run_once: true
      become: false
      when:
        - wallet_src | length > 0
        - (deploy_remedios_api | default(false) | bool) == true

    - name: Abortar si la ruta de wallet no existe en el controlador
      fail:
        msg: "ORACLE_WALLET_PATH='{{ wallet_src }}' no existe en el controlador. Ajusta la ruta en .secrets a un ZIP válido."
      when:
        - wallet_src | length > 0
        - wallet_file.stat is defined
        - not wallet_file.stat.exists
        - (deploy_remedios_api | default(false) | bool) == true

    - name: Abortar si el wallet no es una carpeta (descomprime localmente el zip)
      fail:
        msg: "ORACLE_WALLET_PATH debe apuntar a una carpeta (contenido descomprimido del wallet). Ajusta .secrets."
      when:
        - wallet_src | length > 0
        - wallet_file.stat is defined
        - wallet_file.stat.exists
        - not wallet_file.stat.isdir
        - (deploy_remedios_api | default(false) | bool) == true

    - name: Validar que existe OCI config en el controlador (si se definió)
      stat:
        path: "{{ oci_config_src }}"
      register: oci_config_file
      delegate_to: localhost
      run_once: true
      become: false
      when:
        - oci_config_src | length > 0
        - (deploy_remedios_api | default(false) | bool) == true or (deploy_openclaw | default(false) | bool) == true

    - name: Validar que existe OCI key en el controlador (si se definió)
      stat:
        path: "{{ oci_key_src }}"
      register: oci_key_file
      delegate_to: localhost
      run_once: true
      become: false
      when:
        - oci_key_src | length > 0
        - (deploy_remedios_api | default(false) | bool) == true or (deploy_openclaw | default(false) | bool) == true

    - name: Abortar si falta OCI config o key
      fail:
        msg: "OCI_CONFIG_PATH y OCI_API_KEY_PATH deben existir en el controlador. Ajusta .secrets."
      when:
        - (deploy_remedios_api | default(false) | bool) == true or (deploy_openclaw | default(false) | bool) == true
        - >
          (oci_config_src | length == 0) or (oci_key_src | length == 0) or
          (oci_config_file.stat is defined and not oci_config_file.stat.exists) or
          (oci_key_file.stat is defined and not oci_key_file.stat.exists)

    - name: Crear carpetas de trabajo
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ app_root }}"
        - "{{ src_dir }}"
        - "{{ app_root }}/deploy"
        - "{{ wallet_dir }}"
        - "{{ app_root }}/oci"

    - name: Sincronizar código de remedios al master
      synchronize:
        src: "{{ playbook_dir }}/../../remedios/"
        dest: "{{ remedios_src }}/"
        delete: no
        rsync_opts:
          - "--exclude=.venv"
          - "--exclude=__pycache__"
          - "--exclude=.git"

    - name: Copiar manifiesto de dispatcher
      copy:
        src: ../deploy/dispatcher.yaml
        dest: "{{ dispatcher_manifest }}"
        mode: "0644"
      when: (deploy_dispatcher | default(false) | bool) == true

    - name: Copiar .secrets al master
      copy:
        src: "{{ secrets_src }}"
        dest: "{{ app_root }}/.secrets"
        mode: "0600"

    - name: Renderizar manifiesto de dispatcher con variables de .secrets
      shell: |
        set -a
        . {{ app_root }}/.secrets
        set +a
        if [ -z "${DOMAIN:-}" ]; then
          echo "DOMAIN debe estar definido en {{ app_root }}/.secrets" >&2
          exit 1
        fi
        envsubst < {{ dispatcher_manifest }} > /tmp/dispatcher.rendered.yaml
      args:
        executable: /bin/bash
      when: (deploy_dispatcher | default(false) | bool) == true

    - name: Copiar manifiesto de remedios-api
      copy:
        src: ../deploy/remedios-api.yaml
        dest: "{{ api_manifest }}"
        mode: "0644"
      when: (deploy_remedios_api | default(false) | bool) == true

    - name: Sincronizar wallet de Oracle (carpeta ya descomprimida en el controlador)
      synchronize:
        src: "{{ wallet_src }}/"
        dest: "{{ wallet_dir }}/"
        delete: yes
      when:
        - wallet_src | length > 0
        - wallet_file.stat is defined
        - wallet_file.stat.exists
        - wallet_file.stat.isdir
        - (deploy_remedios_api | default(false) | bool) == true

    - name: Crear/actualizar secret oracle-wallet desde carpeta descomprimida
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} create secret generic oracle-wallet \
          --from-file={{ wallet_dir }}/ \
          -n remedios \
          --dry-run=client -o yaml | kubectl --kubeconfig={{ kubeconfig }} apply -f -
      when:
        - wallet_src | length > 0
        - wallet_file.stat is defined
        - wallet_file.stat.exists
        - wallet_file.stat.isdir
        - (deploy_remedios_api | default(false) | bool) == true

    - name: Copiar OCI config al master
      copy:
        src: "{{ oci_config_src }}"
        dest: "{{ app_root }}/oci/config"
        mode: "0600"
      when:
        - oci_config_src | length > 0
        - oci_config_file.stat is defined
        - oci_config_file.stat.exists
        - (deploy_remedios_api | default(false) | bool) == true or (deploy_openclaw | default(false) | bool) == true

    - name: Copiar OCI API key al master
      copy:
        src: "{{ oci_key_src }}"
        dest: "{{ app_root }}/oci/oci_api_key.pem"
        mode: "0600"
      when:
        - oci_key_src | length > 0
        - oci_key_file.stat is defined
        - oci_key_file.stat.exists
        - (deploy_remedios_api | default(false) | bool) == true or (deploy_openclaw | default(false) | bool) == true

    - name: Crear/actualizar secret oci-config (config + key)
      shell: |
        tmpdir=$(mktemp -d)
        cp {{ app_root }}/oci/config "$tmpdir/config"
        sed -E -i 's#^key_file[[:space:]]*=.*#key_file=/opt/oci/oci_api_key.pem#' "$tmpdir/config"
        if ! grep -q '^key_file' "$tmpdir/config"; then
          echo "key_file=/opt/oci/oci_api_key.pem" >> "$tmpdir/config"
        fi
        kubectl --kubeconfig={{ kubeconfig }} create secret generic oci-config \
          --from-file=config="$tmpdir/config" \
          --from-file=oci_api_key.pem={{ app_root }}/oci/oci_api_key.pem \
          -n remedios \
          --dry-run=client -o yaml | kubectl --kubeconfig={{ kubeconfig }} apply -f -
        rm -rf "$tmpdir"
      when:
        - oci_config_src | length > 0
        - oci_key_src | length > 0
        - oci_config_file.stat is defined
        - oci_config_file.stat.exists
        - oci_key_file.stat is defined
        - oci_key_file.stat.exists
        - (deploy_remedios_api | default(false) | bool) == true or (deploy_openclaw | default(false) | bool) == true

    - name: Verificar secret oci-config en namespace remedios
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} get secret oci-config -n remedios >/dev/null 2>&1
      register: oci_secret_check
      changed_when: false
      failed_when: oci_secret_check.rc != 0
      when: (deploy_remedios_api | default(false) | bool) == true or (deploy_openclaw | default(false) | bool) == true


    - name: Copiar network policy de remedios (dispatcher)
      copy:
        src: ../deploy/remedios-networkpolicy.yaml
        dest: "{{ app_root }}/deploy/remedios-networkpolicy.yaml"
        mode: "0644"
      when: (deploy_dispatcher | default(false) | bool) == true

    - name: Aplicar manifiesto de dispatcher
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f /tmp/dispatcher.rendered.yaml
      when: (deploy_dispatcher | default(false) | bool) == true

    - name: Reiniciar deployment dispatcher para coger cambios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout restart deployment/dispatcher -n remedios
      register: restart_dispatcher
      changed_when: "'restarted' in restart_dispatcher.stdout or restart_dispatcher.rc == 0"
      when: (deploy_dispatcher | default(false) | bool) == true

    - name: Esperar rollout de dispatcher
      command: kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/dispatcher -n remedios
      when: (deploy_dispatcher | default(false) | bool) == true

    - name: Aplicar manifiesto de remedios-api
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f {{ api_manifest }}
      when: (deploy_remedios_api | default(false) | bool) == true

    - name: Reiniciar deployment remedios-api para coger cambios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout restart deployment/remedios-api -n remedios
      register: restart_remedios_api
      changed_when: "'restarted' in restart_remedios_api.stdout or restart_remedios_api.rc == 0"
      when: (deploy_remedios_api | default(false) | bool) == true

    - name: Esperar rollout de remedios-api
      command: kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/remedios-api -n remedios
      when: (deploy_remedios_api | default(false) | bool) == true

    - name: Copiar manifiesto de remetext
      copy:
        src: ../deploy/remetext.yaml
        dest: "{{ app_root }}/deploy/remetext.yaml"
        mode: "0644"
      when: (deploy_remetext | default(false) | bool) == true

    - name: Copiar manifiesto de whisper-turbo
      copy:
        src: ../deploy/audio_whisperturbo.yaml
        dest: "{{ whisper_turbo_manifest }}"
        mode: "0644"
      when: (deploy_whisper_turbo | default(false) | bool) == true

    - name: Copiar manifiesto de openclaw
      copy:
        src: ../deploy/openclaw.yaml
        dest: "{{ openclaw_manifest }}"
        mode: "0644"
      when: (deploy_openclaw | default(false) | bool) == true

    - name: Copiar manifiesto de backup diario de openclaw
      copy:
        src: ../deploy/openclaw-backup-cronjob.yaml
        dest: "{{ openclaw_backup_manifest }}"
        mode: "0644"
      when: (deploy_openclaw | default(false) | bool) == true

    - name: Copiar manifiesto de ingress UI de openclaw
      copy:
        src: ../deploy/openclaw-ui-ingress.yaml
        dest: "{{ openclaw_ui_manifest }}"
        mode: "0644"
      when: deploy_openclaw_ui is defined

    - name: Renderizar manifiestos de openclaw con variables de .secrets
      shell: |
        set -a
        . {{ app_root }}/.secrets
        set +a
        : "${OPENCLAW_IMAGE:=ghcr.io/borisfaj/openclaw:latest}"
        : "${OPENCLAW_SNAPSHOT_IMAGE:=ghcr.io/borisfaj/openclaw-snapshot:latest}"
        : "${OPENCLAW_PVC_SIZE:=5Gi}"
        : "${OPENCLAW_STORAGE_CLASS:=local-path}"
        : "${OPENCLAW_BUCKET_PREFIX:=openclaw/snapshots}"
        : "${OPENCLAW_RETENTION_DAYS:=10}"
        : "${OPENCLAW_CHECKPOINT_INTERVAL_MINUTES:=30}"
        : "${OPENCLAW_DAILY_HOUR_UTC:=3}"
        : "${OPENCLAW_DAILY_MINUTE_UTC:=0}"
        : "${OPENCLAW_DAILY_CRON:=0 3 * * *}"

        export OPENCLAW_IMAGE OPENCLAW_SNAPSHOT_IMAGE OPENCLAW_PVC_SIZE OPENCLAW_STORAGE_CLASS
        export OPENCLAW_BUCKET_PREFIX OPENCLAW_RETENTION_DAYS OPENCLAW_CHECKPOINT_INTERVAL_MINUTES
        export OPENCLAW_DAILY_HOUR_UTC OPENCLAW_DAILY_MINUTE_UTC OPENCLAW_DAILY_CRON
        envsubst < {{ openclaw_manifest }} > /tmp/openclaw.rendered.yaml
        envsubst < {{ openclaw_backup_manifest }} > /tmp/openclaw-backup.rendered.yaml
      args:
        executable: /bin/bash
      when: (deploy_openclaw | default(false) | bool) == true

    - name: Renderizar ingress UI de openclaw con variables de .secrets
      shell: |
        set -a
        . {{ app_root }}/.secrets
        set +a
        if [ -z "${OPENCLAW_UI_HOST:-}" ]; then
          echo "OPENCLAW_UI_HOST debe estar definido en {{ app_root }}/.secrets para activar la UI" >&2
          exit 1
        fi
        export OPENCLAW_UI_HOST
        envsubst < {{ openclaw_ui_manifest }} > /tmp/openclaw-ui.rendered.yaml
      args:
        executable: /bin/bash
      when: (deploy_openclaw_ui | default(false) | bool) == true

    - name: Aplicar manifiesto de whisper-turbo
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f {{ whisper_turbo_manifest }}
      when: (deploy_whisper_turbo | default(false) | bool) == true

    - name: Reiniciar deployment whisper-turbo para coger cambios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout restart deployment/whisper-turbo -n remedios
      register: restart_audio_turbo
      changed_when: "'restarted' in restart_audio_turbo.stdout or restart_audio_turbo.rc == 0"
      when: (deploy_whisper_turbo | default(false) | bool) == true

    - name: Esperar rollout de whisper-turbo
      command: kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/whisper-turbo -n remedios
      when: (deploy_whisper_turbo | default(false) | bool) == true

    - name: Validar credenciales de GHCR en .secrets
      shell: |
        set -a
        . {{ app_root }}/.secrets
        set +a
        # GHCR creds opcionales: si faltan, se intentará pull público
        if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
          echo "Aviso: GHCR_USERNAME/GHCR_TOKEN no definidos; se asume imagen pública" >&2
        fi
      args:
        chdir: "{{ remedios_src }}"
        executable: /bin/bash

    - name: Crear namespace remedios si no existe
      shell: |
        kubectl --kubeconfig={{ kubeconfig }} get ns remedios >/dev/null 2>&1 || \
        kubectl --kubeconfig={{ kubeconfig }} create ns remedios
      changed_when: false

    - name: Crear/actualizar secret remedios-secrets desde .secrets (sin ORACLE_WALLET_PATH)
      shell: |
        tmp=$(mktemp)
        grep -Ev '^(ORACLE_WALLET_PATH|ORACLE_DSN|OCI_CONFIG_PATH|OCI_API_KEY_PATH|OPENCLAW_GATEWAY_TOKEN)=' {{ app_root }}/.secrets > "$tmp"
        dsn="{{ oracle_dsn }}"
        if [ -z "$dsn" ] && [ -f "{{ wallet_dir }}/tnsnames.ora" ]; then
          dsn=$(awk 'match($0,/^[[:space:]]*([A-Za-z0-9._-]+)[[:space:]]*=/,a){print a[1]; exit}' {{ wallet_dir }}/tnsnames.ora)
        fi
        if [ -z "$dsn" ]; then
          echo "No se pudo determinar ORACLE_DSN (define ORACLE_DSN en .secrets o revisa tnsnames.ora)" >&2
          exit 1
        fi
        echo "ORACLE_DSN=$dsn" >> "$tmp"
        kubectl --kubeconfig={{ kubeconfig }} create secret generic remedios-secrets \
          --from-env-file="$tmp" \
          -n remedios \
          --dry-run=client -o yaml | kubectl --kubeconfig={{ kubeconfig }} apply -f -
        rm -f "$tmp"
      when: (deploy_dispatcher | default(false) | bool) or (deploy_remedios_api | default(false) | bool) or (deploy_remetext | default(false) | bool) or (deploy_whisper_turbo | default(false) | bool) or (deploy_openclaw | default(false) | bool)

    - name: Crear/actualizar pull secret ghcr-creds para GHCR (si hay credenciales)
      shell: |
        set -a
        . {{ app_root }}/.secrets
        set +a
        if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
          exit 0
        fi
        kubectl --kubeconfig={{ kubeconfig }} create secret docker-registry ghcr-creds \
          --docker-server=ghcr.io \
          --docker-username="$GHCR_USERNAME" \
          --docker-password="$GHCR_TOKEN" \
          -n remedios \
          --dry-run=client -o yaml | kubectl --kubeconfig={{ kubeconfig }} apply -f -

    - name: Aplicar manifiesto de openclaw
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f /tmp/openclaw.rendered.yaml
      when: (deploy_openclaw | default(false) | bool) == true

    - name: Aplicar cronjob de backup diario de openclaw
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f /tmp/openclaw-backup.rendered.yaml
      when: (deploy_openclaw | default(false) | bool) == true

    - name: Reiniciar deployment openclaw para coger cambios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout restart deployment/openclaw -n remedios
      register: restart_openclaw
      changed_when: "'restarted' in restart_openclaw.stdout or restart_openclaw.rc == 0"
      when: (deploy_openclaw | default(false) | bool) == true

    - name: Esperar rollout de openclaw
      command: kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/openclaw -n remedios
      when: (deploy_openclaw | default(false) | bool) == true

    - name: Aplicar ingress UI de openclaw
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f /tmp/openclaw-ui.rendered.yaml
      when: (deploy_openclaw_ui | default(false) | bool) == true

    - name: Desactivar ingress UI de openclaw
      command: kubectl --kubeconfig={{ kubeconfig }} delete ingress/openclaw-ui -n remedios --ignore-not-found=true
      when:
        - deploy_openclaw_ui is defined
        - (deploy_openclaw_ui | bool) == false


    - name: Aplicar manifiesto de remetext
      command: kubectl --kubeconfig={{ kubeconfig }} apply -n remedios -f {{ app_root }}/deploy/remetext.yaml
      when: (deploy_remetext | default(false) | bool) == true

    - name: Reiniciar deployment remetext para coger cambios
      command: kubectl --kubeconfig={{ kubeconfig }} rollout restart deployment/remetext -n remedios
      register: restart_out
      changed_when: "'restarted' in restart_out.stdout or restart_out.rc == 0"
      when: (deploy_remetext | default(false) | bool) == true

    - name: Esperar rollout de remetext
      command: kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/remetext -n remedios
      when: (deploy_remetext | default(false) | bool) == true
